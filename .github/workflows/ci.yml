name: ci

# The panel had no automated check of any kind: ~5,700 lines of Python and ~290 KB of browser JavaScript,
# and the only thing standing between a typo and the dashboard was someone remembering to run a script.
#
# What runs here, and why each one exists:
#
#   py_compile            the Python parses. `-W error::SyntaxWarning` is deliberate: an invalid escape
#                         sequence (a JS regex `\d` inside a non-raw string) is a warning today and a
#                         SyntaxError in a future Python — i.e. a panel that stops importing at all.
#   js_syntax_check.py    the browser JS parses. It must be checked on the DECODED INDEX_HTML, never on
#                         the .py bytes: in the source the escapes are unresolved and the __..._JSON__
#                         placeholders are still literal, so a checker reading the file directly either
#                         chokes or — worse — passes on something the browser never sees.
#   tuning_consistency    panel/node/core agree on every tuning knob. core's tuning.go is the authority.
#   speedtest_measures_the_tunnel  the card's speed button tests the OVERLAY address, so the number
#                         is the tunnel's own capacity and not the internet path, and it runs on the
#                         client end so "upload" is the leg the operator means.
#   tunnel_port_is_random the port a new tunnel gets is drawn, not counted up from 20000, and no two
#                         tunnels anywhere hold the same one. The old allocator handed out the lowest
#                         free port, so one tunnel's number told an observer where all the others were.
#   log_labels_check      every log label the backend emits still renders as a pill, not as prose.
#   core_rejects          the panel refuses every combination the CORE refuses. When it does not, the
#                         operator saves a form, the node stores it, and the core then exits on
#                         validate() -- both ends refuse to start with nothing in between saying why.
#   delivery_mode         the three delivery modes (panel uploads / node fetches from GitHub / node
#                         fetches from the panel) all install the SAME artifact -- the bytes behind
#                         every url hash to the sha the panel signed. Drives the real push APIs, the
#                         ssh install leg and a real GET at the panel Handler, per mode per arch.
#   readiness_gate        adding a node and building a core tunnel are refused server-side while the
#                         panel holds no agent or no core for BOTH arches. The disabled button is not
#                         the gate: a stale page walks past it and the operation half-completes on the
#                         node. Drives the real APIs and the page boot under node.
#   list_diff_keeps_untouched_rows
#                         a list refresh replaces only the rows whose markup changed. Assigning the
#                         whole list drops every row, so a half-made selection, a live upload bar and
#                         an edge box another loop filled all die on a poll the operator did not ask for.
#   a_row_message_survives_the_poll
#                         the answer a card action writes -- «در حال تست…», then the verdict -- is
#                         render state, not something painted onto a node and hoped for. The panel used
#                         to protect it by freezing every list behind a CHECKING counter, so for the
#                         length of a check (and of «تستِ همه» over the whole fleet) nothing going down
#                         reached the screen. It drives the real testNode/checkLink/testPx over the real
#                         setList with a poll landing mid-flight, and derives which strips are at risk
#                         by reading the ids back out of the rendered cards.
#   a_modal_edits_what_it_opened
#                         the other half of letting the lists stay live: the port-forward and proxy
#                         forms used to re-read PF[i]/PX[i] at SAVE time, which was survivable only
#                         while an open form froze the list. Driven on the real forms, it opens the
#                         second row, swaps the list the way a poll would, presses save and reads the
#                         request: measured on the old shape it posted pf-b's ports over pf-a.
#   config_contract       the panel's THREE independent ways of building a node body (create / edit /
#                         rebuild) build the SAME body. This is the guard for the defect class that
#                         shipped three times in a row under "chain verified end to end": a key that
#                         reaches two of the three paths, and a node that drops what it does not
#                         whitelist without a word. It was added without being wired in here, so it
#                         spent its whole life failing on a divergence nobody saw.
#   ws_pool_edit_test     an edit that omits a pool field falls back to the stored pool instead of
#                         emptying it. Added in the same batch, and likewise never run.
#   fec_rate_labels       each FEC rate tile advertises the overhead it really produces, and the
#                         note beside it says that figure is the saturated-block one.
#   http_shape_consistency  the upload/download shape has one range in the browser form, the panel
#                         API, the node whitelist and the core's own ceiling.
#   sni_mode_fields       split_ttl stays a disorder-only knob, on all three build paths AND in the
#                         browser. disorder and fake want opposite values out of that one input, so
#                         offering it for both shipped a decoy that died before the DPI.
#   fake_ttl_cap          fake_ttl means two different things by carrier: raw forges a header
#                         and honours 1..255, while tcp/ws inject on the real connection's 4-tuple and
#                         the core clamps them to injectMaxTTL. The panel stored the unclamped number,
#                         so the form, the node and core's own startup line all reported a hop budget
#                         the wire never carried. The ceiling is read out of core, not copied.
#   i18n_dead_keys        every declared I18N key is rendered somewhere, or composed by a
#                         T('prefix'+…) builder. Dead keys accumulate silently -- nine survived
#                         several rounds of feature removal -- and deleting one by hand has the
#                         opposite trap: `nav_logs` is quoted nowhere and is very much alive.
#   card_names_its_carrier  a tunnel card's header chip, the «نوع» row under it and the profile row
#                         beside it all describe the SAME tunnel. The header and the body derived
#                         their labels separately, so they drifted: the chip said RAW while the body
#                         said Core. It also pins which port rows each carrier prints -- raw's udp and
#                         tcp profiles forge two, everything else has one or none.
#   card_values_are_copyable  the two node IPs and the subnet are tap-to-copy on every card, and the
#                         copy path still works with no navigator.clipboard -- the panel is reached
#                         over plain http, which is not a secure context, so the async API is absent
#                         exactly where the operator is.
#   subnet_parity         the browser and the panel derive the same subnet, AND the core edit form's
#                         range picker round-trips: opening it and saving must send back the address
#                         the tunnel already has, or a rebuild renumbers both ends for nothing.
#   an_action_reports_...  an action that has to talk to a node answers with a KEY, reports its own
#                         steps against it and stops where it runs; an endpoint that HAS an answer
#                         keeps answering with it. Four defects reached the operator when a central
#                         queue stood in between: the node install's step list was polled with the
#                         queue's id and never filled in, «لغو» on a running job only changed a
#                         label, the bar showed percentages no action ever wrote, and an edge probe
#                         returned a ticket so its box was re-read before anything was sent.
#   the_log_keeps_a_day  the log is kept by AGE, forgotten on a clock, and searched where it is
#                         held. A list of 500 threw away events that were minutes old on a fleet
#                         having a bad hour -- from the one page an operator opens to find out what
#                         happened overnight -- and nothing said so.
#   port_tries_is_reported  «چند بار پورتِ مبدأ عوض شود» is REFUSED when out of range, never silently
#                         dropped. The two-digit box took 70, the form clamped it to 0, the backend's
#                         `if _ptries:` skipped the key and the tunnel ran on the default depth of 2 --
#                         typing 70 and typing nothing produced the same tunnel, with nothing on screen
#                         either way. Drives the real _collectCoreBody in node, so it is about the
#                         submit path and not a helper; the ceiling comes from the page's own
#                         PORT_TRIES_MAX, which tuning_consistency pins to core's maxPortTries.
#   ladder_steps_are_reported  a bad number in a comma-separated tuning list is REFUSED, and the two
#                         lists keep separate ranges. Both were filtered to one 1..86400 window, twice
#                         and silently: `45, 3, 600` saved `45, 600` with a green toast, and `3` alone
#                         left the stored default standing. They are different clocks -- the revive wait
#                         is 10..3600 because the node judges a down tunnel about once a second, the
#                         suspect backoff keeps 1..86400 because it waits out a censor.
#   subnet_range_picker   the system-tunnel edit modal picks a range the way the core one does, and
#                         the "(free)" number beside each range is the whole registry's. The modal
#                         seeded its picker with the literal '192.168', so opening a 10.x overlay and
#                         changing only the TYPE renumbered it; and subnetFree counted window.FLEET,
#                         which holds one page's half of the tunnel ids and shrinks while you type in
#                         the search box.
#   an_edit_keeps_the_tunnel_where_it_is  editing a core tunnel does not move it to another address
#                         of its own node. The picker was seeded with ips[0] and pickedIP threw the
#                         stored value away, so on a node with two routable IPv4s, changing only the
#                         cipher rebuilt the tunnel on the OTHER address -- and the backend's own
#                         "keep L[a_ip]" fallback never ran, because the browser always sent something.
#                         Drives the page's real functions under node AND the real api_edit_link.
#   the_push_paints_its_last_state  the fleet update's last poll carries what every node ended as.
#                         api_push_status answered {idle, done} with no order and no nodes, and that is
#                         the ONLY payload the browser sees with done=true -- so the final paint had
#                         nothing in it and the bars kept the previous poll's numbers. On a push that
#                         finishes inside one 400ms interval that is 0%: measured, three nodes that all
#                         ended ok were last painted "wait".
#   the_staging_step_tells_the_truth  reported from the fleet screen: every card read «دانلودِ هستهٔ
#                         روی پنل · ۰٪» while that version was already on the panel. Three things:
#                         staging was skipped only when NO version was named and the form always names
#                         one, so the panel re-fetched both architectures; the ONE shared download was
#                         painted on every node at its own pct, so only the lock winner moved; and in
#                         github delivery the panel downloads nothing at all yet still said it did.
#   the_drift_sweep       the rest of the 2026-09-04 audit, in one file: the CDN edge port the form
#                         accepts, one-sided IP rotation, TLS cover with the cipher off, a Persian node
#                         name, the tunnel search and the palette that jumped to the wrong page, an
#                         empty tuning box, the enable/disable toggle that always said ok, the panel's
#                         own download proxy, an emptied port box, pause on a fleet update, and four
#                         labels the code had stopped matching. 18 failures against the code it
#                         replaced.
#   no_orphan_links       a node record and its links leave together, or neither does. «فقط از پنل جدا
#                         کن» dropped the node and left its links behind, so they named a node that no
#                         longer existed: api_summary counted each one down with an alert that could
#                         never clear, and nothing could remove them. Forgetting the links instead is
#                         worse -- the freed tunnel id is redrawn immediately and silently overwrites
#                         the config still running on the peer -- so the guard pins the invariant, not
#                         the button: after api_node_del, no link names a missing node.
#   node_errors_answer_in_persian  every error a node's own tools produce comes back in Persian. A
#                         missing kernel module reported itself as «RTNETLINK answers: No such file
#                         or directory» to an operator deciding whether to try again.
#   panel_says_what_...   a sentence or a toast that the code contradicts. Both cases it holds were
#                         true when written and were left beside code that stopped making them true:
#                         the CDN_PROFILES header describing "cf" as an empty entry after #295 filled
#                         it in, and the DIRECT pool's «الان تست کن» claiming a probe was sent when
#                         nothing dials. No other guard reads Persian prose.
#
# The last one of those needs all three repositories, so the sibling checkouts below reproduce the
# maintainer's local layout (…/TUNNEL-MANAGER, …/TUNNEL-MANAGER-CORE, …/TUNNEL-MANAGER-NODE) and the
# guards then find each other with their default paths. CORE and NODE are public repositories, so the
# default GITHUB_TOKEN is enough; if either is ever made private this needs a PAT secret instead.
#
# The daily schedule is not redundant with the pull-request trigger: tuning drift can be introduced from
# the CORE or the NODE side, where this workflow does not run. The cron catches that within a day.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the panel
        uses: actions/checkout@v5
        with:
          path: TUNNEL-MANAGER

      - name: Check out core (tuning.go is the authority the guard compares against)
        uses: actions/checkout@v5
        with:
          repository: Angize/TUNNEL-MANAGER-CORE
          path: TUNNEL-MANAGER-CORE

      - name: Check out the node agent
        uses: actions/checkout@v5
        with:
          repository: Angize/TUNNEL-MANAGER-NODE
          path: TUNNEL-MANAGER-NODE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: py_compile (warnings are errors)
        working-directory: TUNNEL-MANAGER
        run: python -W error::SyntaxWarning -m py_compile tnl-central.py

      - name: browser JS parses
        working-directory: TUNNEL-MANAGER
        run: python tools/js_syntax_check.py

      - name: tuning knobs agree across panel / node / core
        working-directory: TUNNEL-MANAGER
        run: python tools/tuning_consistency.py

      - name: a new tunnel's port is drawn at random and never reused
        working-directory: TUNNEL-MANAGER
        run: python tools/tunnel_port_is_random_check.py

      - name: the speed test measures the tunnel, in the direction upload means
        working-directory: TUNNEL-MANAGER
        run: python tools/speedtest_measures_the_tunnel_check.py

      - name: log labels survive the browser's label gate
        working-directory: TUNNEL-MANAGER
        run: python tools/log_labels_check.py

      - name: the panel refuses what the core refuses
        working-directory: TUNNEL-MANAGER
        run: python tools/core_rejects_check.py

      - name: create / edit / rebuild build the same node body
        working-directory: TUNNEL-MANAGER
        run: python tools/config_contract.py

      - name: an edit that omits a pool field keeps the stored pool
        working-directory: TUNNEL-MANAGER
        run: python tools/ws_pool_edit_test.py
      - name: each FEC rate tile advertises the overhead it produces
        working-directory: TUNNEL-MANAGER
        run: python tools/fec_rate_labels_check.py
      - name: the http carrier shape has one range in the form, the API and the node
        working-directory: TUNNEL-MANAGER
        run: python tools/http_shape_consistency.py
      - name: split_ttl stays a disorder-only knob
        working-directory: TUNNEL-MANAGER
        run: python tools/sni_mode_fields_check.py
      - name: fake_ttl reports what the wire carries
        working-directory: TUNNEL-MANAGER
        run: python tools/fake_ttl_cap_check.py
      - name: a moved node is not forgotten
        working-directory: TUNNEL-MANAGER
        run: python tools/a_moved_node_is_not_forgotten_check.py
      - name: pushes do not queue behind each other
        working-directory: TUNNEL-MANAGER
        run: python tools/pushes_do_not_queue_behind_each_other_check.py
      - name: github mode downloads nothing to the panel
        working-directory: TUNNEL-MANAGER
        run: python tools/github_mode_downloads_nothing_check.py
      - name: github delivery, panel to node, end to end
        working-directory: TUNNEL-MANAGER
        run: python tools/github_delivery_end_to_end_check.py
      - name: the panel can reach github through one of its proxies
        working-directory: TUNNEL-MANAGER
        run: python tools/panel_downloads_can_take_the_proxy_check.py
      - name: a failed update check tells the operator why
        working-directory: TUNNEL-MANAGER
        run: python tools/a_failed_update_check_says_why_check.py
      - name: the click starts the work, the panel does not stall on it
        working-directory: TUNNEL-MANAGER
        run: python tools/the_click_starts_the_work_check.py
      - name: the panel's own download is visible and can be stopped
        working-directory: TUNNEL-MANAGER
        run: python tools/the_panel_download_is_visible_check.py
      - name: the fetch-from-github button shows progress and stops
        working-directory: TUNNEL-MANAGER
        run: python tools/the_fetch_button_shows_and_stops_check.py
      - name: a picked version is not an update for the whole fleet
        working-directory: TUNNEL-MANAGER
        run: python tools/a_pick_is_not_an_update_check.py
      - name: a proxied node can still be given a download address
        working-directory: TUNNEL-MANAGER
        run: python tools/a_proxied_node_can_still_download_check.py
      - name: every call to a node says where the panel is
        working-directory: TUNNEL-MANAGER
        run: python tools/every_call_says_where_the_panel_is_check.py
      - name: the panel's prose and toasts agree with what it does
        working-directory: TUNNEL-MANAGER
        run: python tools/panel_says_what_it_does_check.py
      - name: the FEC switch says the truth on every transport
        working-directory: TUNNEL-MANAGER
        run: python tools/fec_gate_check.py
      - name: a rotation body carries only keys the core accepts
        working-directory: TUNNEL-MANAGER
        run: python tools/rotation_body_keys_check.py
      - name: every declared I18N key is rendered or composed
        working-directory: TUNNEL-MANAGER
        run: python tools/i18n_dead_keys_check.py
      - name: all three delivery modes deliver the same artifact
        working-directory: TUNNEL-MANAGER
        run: python tools/delivery_mode_check.py
      - name: the panel refuses an install or a core build it cannot finish
        working-directory: TUNNEL-MANAGER
        run: python tools/readiness_gate_check.py
      - name: a list refresh replaces only the rows that changed
        working-directory: TUNNEL-MANAGER
        run: python tools/list_diff_keeps_untouched_rows_check.py
      - name: an answer painted into a card survives the poll that rebuilds it
        working-directory: TUNNEL-MANAGER
        run: python tools/a_row_message_survives_the_poll_check.py
      - name: an edit form saves the record it was opened on
        working-directory: TUNNEL-MANAGER
        run: python tools/a_modal_edits_what_it_opened_check.py
      - name: a slow peer is served the whole body
        working-directory: TUNNEL-MANAGER
        run: python tools/slow_peer_full_body_check.py
      - name: the panel signs what the node verifies
        working-directory: TUNNEL-MANAGER
        run: python tools/signed_control_end_to_end_check.py
      - name: a card's chip, type row and profile row describe one tunnel
        working-directory: TUNNEL-MANAGER
        run: python tools/card_names_its_carrier_check.py
      - name: card addresses are one tap from the clipboard, over plain http too
        working-directory: TUNNEL-MANAGER
        run: python tools/card_values_are_copyable_check.py
      - name: the browser and the panel derive the same subnet, and the edit form round-trips it
        working-directory: TUNNEL-MANAGER
        run: python tools/subnet_parity_check.py
      - name: an action reports where it runs, and can be stopped there
        working-directory: TUNNEL-MANAGER
        run: python tools/an_action_reports_where_it_runs_check.py
      - name: every English error a node produces is answered in Persian
        working-directory: TUNNEL-MANAGER
        run: python tools/node_errors_answer_in_persian_check.py
      - name: the log keeps a day and is searched where it is held
        working-directory: TUNNEL-MANAGER
        run: python tools/the_log_keeps_a_day_check.py
      - name: a node and its links leave together
        working-directory: TUNNEL-MANAGER
        run: python tools/no_orphan_links_check.py
      - name: the 2026-09-04 drift sweep stays closed
        working-directory: TUNNEL-MANAGER
        run: python tools/the_drift_sweep_check.py
      - name: the panel does not re-download a core it already holds
        working-directory: TUNNEL-MANAGER
        run: python tools/the_staging_step_tells_the_truth_check.py
      - name: an edit keeps the tunnel on the address it already has
        working-directory: TUNNEL-MANAGER
        run: python tools/an_edit_keeps_the_tunnel_where_it_is_check.py
      - name: the fleet update paints the state every node ended in
        working-directory: TUNNEL-MANAGER
        run: python tools/the_push_paints_its_last_state_check.py
      - name: an out-of-range port-rung depth is refused, not dropped
        working-directory: TUNNEL-MANAGER
        run: python tools/port_tries_is_reported_check.py
      - name: an out-of-range tuning step is refused, not dropped from the list
        working-directory: TUNNEL-MANAGER
        run: python tools/ladder_steps_are_reported_check.py
      - name: the range picker opens where the tunnel is, and counts the whole registry
        working-directory: TUNNEL-MANAGER
        run: python tools/subnet_range_picker_check.py
      - name: A live ECH push that never reached the node must not be logged green, and must be recovered
        working-directory: TUNNEL-MANAGER
        run: python tools/a_failed_ech_push_is_not_reported_as_success_check.py
      - name: a subnet a node already holds on ANOTHER card is refused, on all three build paths
        working-directory: TUNNEL-MANAGER
        run: python tools/addr_in_use_check.py
      - name: Every change the operator did NOT make must reach the log, exactly once, and only when it is true
        working-directory: TUNNEL-MANAGER
        run: python tools/autonomous_changes_reach_the_log_check.py
      - name: every call to a panel helper matches the signature it is calling
        working-directory: TUNNEL-MANAGER
        run: python tools/call_shapes_check.py
      - name: the connection check must not report success on a probe it just watched fail
        working-directory: TUNNEL-MANAGER
        run: python tools/conn_verdict_check.py
      - name: the uploaded core binary can be thrown away, and throwing it away really removes the choice
        working-directory: TUNNEL-MANAGER
        run: python tools/core_blob_delete_check.py
      - name: every CSS custom property the panel USES is actually DEFINED
        working-directory: TUNNEL-MANAGER
        run: python tools/css_vars_defined_check.py
      - name: The panel serves the range the NODE asks for — proved against the node's own fetch code
        working-directory: TUNNEL-MANAGER
        run: python tools/dl_range_end_to_end_check.py
      - name: A tunnel that loses its ECH record must come back to ECH by itself when the record returns
        working-directory: TUNNEL-MANAGER
        run: python tools/ech_comes_back_when_the_record_does_check.py
      - name: The ECH auto-heal must key on a signal the core CLEARS when the tunnel goes down
        working-directory: TUNNEL-MANAGER
        run: python tools/ech_heal_reads_a_live_signal_check.py
      - name: Guard for G2, the lane that writes the core's in-band ECH self-heal back into the stored config
        working-directory: TUNNEL-MANAGER
        run: python tools/ech_heal_survives_a_core_restart_check.py
      - name: a form error takes the middle of the screen and stays until it is dismissed
        working-directory: TUNNEL-MANAGER
        run: python tools/errors_pop_check.py
      - name: Every path that builds a node body must apply every per-body core helper — all four of them
        working-directory: TUNNEL-MANAGER
        run: python tools/every_build_path_carries_workers_check.py
      - name: every guard in tools/ is wired into CI, or this step says which are not
        working-directory: TUNNEL-MANAGER
        run: python tools/every_guard_runs_in_ci_check.py
      - name: the core form's IP-row containers must carry the ids renderRotIps BUILDS
        working-directory: TUNNEL-MANAGER
        run: python tools/ip_row_ids_check.py
      - name: Every function the browser calls, and every CSS class its markup uses, must actually exist
        working-directory: TUNNEL-MANAGER
        run: python tools/js_names_exist_check.py
      - name: the system log's fold covers endpoint rows and never swallows a plain sentence
        working-directory: TUNNEL-MANAGER
        run: python tools/log_fold_check.py
      - name: a rotation card names the src -> dst PAIR, even on a panel that just started
        working-directory: TUNNEL-MANAGER
        run: python tools/log_rot_pair_check.py
      - name: Every way out to a node must resolve through node_proxy — no exceptions, no third path
        working-directory: TUNNEL-MANAGER
        run: python tools/node_egress_uses_proxy_check.py
      - name: The node's OWN traffic figure is on its list row, and the operator can zero it
        working-directory: TUNNEL-MANAGER
        run: python tools/node_traffic_row_check.py
      - name: The browser may only read node fields that _node_view actually sends
        working-directory: TUNNEL-MANAGER
        run: python tools/node_view_keys_check.py
      - name: One pool SNI losing its ECH record must be degraded and reported, not left with a stale key
        working-directory: TUNNEL-MANAGER
        run: python tools/one_dead_sni_does_not_poison_the_pool_check.py
      - name: The panel must not hide the outcome of a long operation from the operator
        working-directory: TUNNEL-MANAGER
        run: python tools/operator_sees_outcome_check.py
      - name: the subnet-overlap refusal says each range once, and still names the other one when it differs
        working-directory: TUNNEL-MANAGER
        run: python tools/overlap_message_check.py
      - name: An IP a rotation pool cycles through is IN USE, and must never read «آزاد»
        working-directory: TUNNEL-MANAGER
        run: python tools/pool_ip_is_not_free_check.py
      - name: The port-roll line must name what the recovery COST, not just that it happened
        working-directory: TUNNEL-MANAGER
        run: python tools/port_roll_line_names_the_cost_check.py
      - name: the tun-probe threshold reaches the node body, on every build path and every tunnel TYPE
        working-directory: TUNNEL-MANAGER
        run: python tools/probe_threshold_reaches_node_check.py
      - name: The proxy registry endpoints, driven for real against temp files
        working-directory: TUNNEL-MANAGER
