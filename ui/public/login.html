<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود به پنل</title>
<link rel="preload" href="/assets/fonts/vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<script>try{if(localStorage.getItem('tnl_dark'))document.documentElement.classList.add('dark')}catch{}</script>
<link rel="stylesheet" href="/assets/orbital-sky.css">
<script defer src="/assets/orbital-sky.js"></script>
<style>
@font-face{font-family:Vazir;src:url('/assets/fonts/vazirmatn.woff2') format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
 color-scheme:light;--page:#e6ebf3;--glow1:#d3e0ff;--glow2:#d8e0fb;--card:rgba(255,255,255,.7);--edge:rgba(15,27,45,.1);--hi:rgba(255,255,255,.95);--field:rgba(15,27,45,.04);
 --accent:#4d6bf0;--ink:#0f1b2d;--muted:#57667c;--blue:#3154ee;--danger:#bc2c2c;--fill:#4460e6;--fill-deep:#3a53d0;
 --panel-shadow:0 1px 2px rgba(15,27,45,.05),0 16px 44px -28px rgba(15,27,45,.45),inset 0 1px var(--hi);
 --control-edge:#7b8ba5;--small-surface:#eef2fd
}
html.dark{
 color-scheme:dark;--page:#0d1220;--glow1:#1c2a5a;--glow2:#162049;--card:rgba(255,255,255,.06);--edge:rgba(255,255,255,.1);--hi:rgba(255,255,255,.08);--field:rgba(0,0,0,.22);
 --accent:#8fa3ff;--ink:#e8edf5;--muted:#98a5ba;--blue:var(--accent);--danger:#f87171;
 --panel-shadow:0 16px 44px -30px rgba(0,0,0,.7),inset 0 1px var(--hi);
 --control-edge:#6e7d98;--small-surface:#1b243d
}
html{background:var(--page)}
body{font-family:Vazir,Tahoma,sans-serif;color:var(--ink);margin:0;min-height:100vh;min-height:100svh;isolation:isolate;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center}
button,input{font:inherit}
.text-slot input:is(:autofill,:-webkit-autofill){-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
#themeControl:active svg,#eye:active svg{transform:scale(.9)}
button{color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
body{position:relative}
#themeControl{position:fixed;z-index:1;inset:auto auto 16px 16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--small-surface);border:1px solid var(--edge);color:var(--blue)}
#themeControl svg{width:20px;height:20px;stroke-width:1.8}
.card{align-self:center;grid-row:2;width:min(444px,calc(100% - 32px));margin:28px 0 0;padding:25px 30px 28px;border-radius:26px;border:1px solid var(--edge);background:var(--card);box-shadow:var(--panel-shadow);backdrop-filter:blur(9px) saturate(150%)}
.progress{display:flex;align-items:center;gap:12px;margin:18px 0}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.steps{display:flex;gap:5px;flex:1}
.steps i{background:color-mix(in srgb,var(--muted) 24%,transparent);height:3px;border-radius:3px;flex:1;position:relative;overflow:hidden}
.steps i:after{content:"";position:absolute;inset:0;background:var(--accent);border-radius:inherit;transform:scaleX(0);transform-origin:right;transition:transform .45s ease}
.steps i:first-child:after,body:not([data-step="account"]) .steps i:after{transform:scaleX(1)}
.login-intro{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(10px,3vw,16px)}
.seal{width:64px;height:64px;display:grid;place-items:center;position:relative;isolation:isolate;border-radius:21px;color:var(--blue);
 background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 22%,var(--small-surface)),var(--small-surface) 55%);border:1px solid color-mix(in srgb,var(--accent) 32%,var(--edge));box-shadow:0 7px 15px -10px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px var(--hi)}
.seal:before,.seal:after{content:"";position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-radius:16px;box-shadow:inset 0 1px var(--hi)}
.seal:after{inset:10px;border-radius:12px;background:linear-gradient(145deg,var(--small-surface),color-mix(in srgb,var(--accent) 18%,var(--small-surface)));box-shadow:inset 0 1px var(--hi),0 2px 5px color-mix(in srgb,var(--accent) 24%,transparent);z-index:-1}
.seal svg{position:absolute;width:27px;height:27px;transition:opacity .26s,transform .42s cubic-bezier(.2,.8,.25,1);opacity:0;transform:translateY(4px) scale(.82)}
body[data-step="account"] .seal .person,body[data-step="password"] .seal .key,body[data-step="success"] .seal .check{opacity:1;transform:translateY(0) scale(1)}
h1{font-size:clamp(26px,8vw,39px);font-weight:850;line-height:1.4;letter-spacing:-.055em;margin:0}
.context{display:flex;align-items:center;gap:7px;min-height:44px;margin-top:3px;line-height:1.6;font-size:14px;color:var(--muted)}
.context .identity{display:inline-flex;align-items:center;gap:6px;max-width:60%;min-width:0;font-weight:700;color:var(--ink)}
.typing{position:relative;display:inline-block}
.typing span{display:block;animation:reveal-line 1.65s steps(28,end) both}
.typing:after{position:absolute;content:"";top:12%;height:76%;width:1.5px;background:var(--blue);opacity:0;animation:typing-caret 1.65s steps(28,end) both}
@keyframes reveal-line{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
@keyframes typing-caret{0%{right:0;opacity:.8}99%{right:100%;opacity:.8}100%{right:100%;opacity:0}}
.identity bdi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.identity svg{width:16px;height:16px;flex:none}
.edit{flex:none;min-height:44px;border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:670;padding:0 8px;border-radius:7px;text-decoration:underline;text-decoration-color:#a6b6ec;text-underline-offset:4px}
.step-in{animation:step-in .36s cubic-bezier(.2,.75,.2,1) both}
@keyframes step-in{from{opacity:0;transform:translateX(9px)}}
.input-shell{position:relative;display:flex;align-items:center;gap:10px;border:1px solid var(--control-edge);border-radius:13px;background:var(--field);min-height:62px;padding:0 13px;transition:border-color .15s,box-shadow .15s}
.input-shell:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #8fa3ff2e}
.input-shell.invalid{border-color:var(--danger);box-shadow:0 0 0 2px #ab315012}
.field-glyph{width:29px;height:29px;background:color-mix(in srgb,var(--accent) 11%,transparent);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);color:var(--blue);border-radius:9px;display:grid;place-items:center;flex:none}
.field-glyph svg{width:17px;height:17px}
.text-slot{min-width:0;flex:1;position:relative;height:54px}
.text-slot input{width:100%;height:100%;padding:17px 1px 0;border:none;background:transparent;outline:0;color:var(--ink);font-size:16px;text-align:right}
.text-slot label{position:absolute;right:1px;top:50%;transform:translateY(-50%);transform-origin:right center;white-space:nowrap;font-size:15px;font-weight:590;color:var(--muted);pointer-events:none;transition:transform .16s,color .16s}
.text-slot:focus-within label,.text-slot input:not(:placeholder-shown)+label{transform:translateY(calc(-50% - 12px)) scale(.77);color:var(--blue)}
.password-toggle{flex:0 0 44px;width:44px;height:44px;padding:0;margin-inline-end:-7px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}
.password-toggle svg{display:block;width:17px;height:17px}
@media(hover:hover) and (pointer:fine){.password-toggle:hover{color:var(--ink)}.edit:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}}
.feedback{min-height:29px;font-size:12.5px;color:var(--danger);font-weight:550;padding:3px 2px}
.action{width:100%;min-height:55px;border-radius:13px;border:0;background:linear-gradient(135deg,var(--fill),var(--fill-deep));box-shadow:inset 0 1px #ffffff33,0 6px 15px -9px #425bcc66;color:white;display:flex;align-items:center;justify-content:space-between;text-align:start;padding:5px 17px 5px 8px;font-size:16px;font-weight:760;transition:filter .16s,transform .16s}
@media(hover:hover) and (pointer:fine){.action:hover{filter:brightness(1.055)}}
.action:active{transform:scale(.99)}
.action-icon{width:38px;height:38px;display:grid;place-items:center;background:#ffffff15;border:1px solid #ffffff35;border-radius:10px}
.action-icon svg{width:20px;height:20px}
.action[aria-disabled=true]{cursor:progress}
.busy .action-icon svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#heading:focus{outline:0}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){.card{padding:21px 21px 23px;border-radius:24px}.seal{width:clamp(52px,16vw,60px);height:auto;aspect-ratio:1}}
@media(max-height:590px){body{grid-template-rows:auto auto auto}.card{margin-top:16px}}
@media(max-width:480px){.card{width:min(356px,calc(100% - 44px))}#themeControl{position:absolute;inset:10px auto auto 10px}.card{margin-top:62px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body data-step="account">
<div class="orbital-sky" aria-hidden="true"></div>
<button id="themeControl" type="button" aria-label="نمایش تم تیره" title="نمایش تم تیره"></button>
<main class="card" aria-labelledby="heading">
  <header class="login-intro">
    <div class="seal" id="seal" aria-hidden="true"></div>
    <div>
      <h1 id="heading" tabindex="-1">ورود به پنل</h1>
      <div id="context" class="context"></div>
    </div>
  </header>
  <div class="progress">
    <span class="count" id="count">گام ۱ از ۲</span>
    <div class="steps" aria-hidden="true"><i></i><i></i></div>
  </div>
  <form id="login" action="/api/login" method="post" novalidate>
    <div class="input-shell" id="nameBox"><span class="field-glyph" data-icon="person"></span><div class="text-slot"><input type="text" id="username" name="user" autocomplete="username" dir="auto" placeholder=" " aria-describedby="feedback" autocapitalize="none" spellcheck="false"><label for="username">نام کاربری</label></div></div>
    <div class="input-shell" id="passBox" hidden><span class="field-glyph" data-icon="key"></span><div class="text-slot"><input type="password" id="password" name="pass" autocomplete="current-password" dir="auto" placeholder=" " aria-describedby="feedback" spellcheck="false"><label for="password">رمز عبور</label></div><button type="button" class="password-toggle" aria-label="نمایش رمز عبور" aria-pressed="false" id="eye"></button></div>
    <div role="alert" id="feedback" class="feedback"></div>
    <button type="submit" id="action" class="action"><span id="actionText">ادامه</span><span class="action-icon" id="actionIcon"></span></button>
  </form>
  <div class="visually-hidden" role="status" id="announce"></div>
</main>
<script>
function installThemeControl(){
 const themeButton=document.getElementById('themeControl')
 function updateTheme(){
  const dark=document.documentElement.classList.contains('dark')
  const label=dark?'نمایش تم روشن':'نمایش تم تیره'
  themeButton.setAttribute('aria-label',label)
  themeButton.title=label
  themeButton.innerHTML=icon(dark?'sun':'moon')
 }
 themeButton.addEventListener('click',()=>{
  const dark=document.documentElement.classList.toggle('dark')
  try{localStorage.setItem('tnl_dark',dark?'1':'')}catch{}
  updateTheme()
 })
 updateTheme()
}
const byId=id=>document.getElementById(id)
const drawings={
 moon:'<path d="M18.5 15.7A8 8 0 0 1 8.3 5.5 8.2 8.2 0 1 0 18.5 15.7Z"/><path d="m16 3 .7 2.2L19 6l-2.3.8L16 9l-.7-2.2L13 6l2.3-.8Z"/>',
 sun:'<circle cx="12" cy="12" r="3.8"/><path d="M12 2.5v2m0 15v2m-9.5-9.5h2m15 0h2M5.2 5.2l1.5 1.5m10.6 10.6 1.5 1.5m0-13.6-1.5 1.5M6.7 17.3l-1.5 1.5"/>',
 person:'<circle cx="12" cy="7.8" r="3.4"/><path d="M5.2 20v-1.2c0-3.5 3-5.5 6.8-5.5s6.8 2 6.8 5.5V20"/>',
 key:'<circle cx="8.2" cy="9.1" r="4.7"/><path d="m11.8 12.2 7.7 7.7 2-2-1.9-1.9 1.5-1.5-2.2-2.2-1.4 1.4-2.8-2.8"/><circle cx="7.2" cy="8.2" r=".55"/>',
 eye:'<path d="m2 12 4.5-4.2Q8.4 6 11 6h2q2.6 0 4.5 1.8L22 12l-4.5 4.2Q15.6 18 13 18h-2q-2.6 0-4.5-1.8Z"/><rect x="9.7" y="9.7" width="4.6" height="4.6" rx="1.15" fill="currentColor" stroke="none"/>',
 off:'<path d="m2 9 4.5 4.2Q8.4 15 11 15h2q2.6 0 4.5-1.8L22 9M6.5 13.2l-1.6 2.3M12 15v2.7m5.5-4.5 1.6 2.3"/>',
 arrow:'<path d="M20 12H4m6-6-6 6 6 6"/>',
 check:'<path d="m4.5 12.3 5 5 10-11"/>',
 wait:'<path d="M19.5 15a8 8 0 1 1-2-9"/>'
}
function icon(name){return '<svg class="'+name+'" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">'+drawings[name]+'</svg>'}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon))
byId('seal').innerHTML=['person','key','check'].map(icon).join('')
const username=byId('username'),password=byId('password'),form=byId('login')
let stage='account',working=false
function clearError(){
 byId('feedback').textContent=''
 for(const [el,box] of [[username,byId('nameBox')],[password,byId('passBox')]]){
  el.removeAttribute('aria-invalid')
  box.classList.remove('invalid')
 }
}
function error(message,input){
 byId('feedback').textContent=message
 input.setAttribute('aria-invalid','true')
 input.closest('.input-shell').classList.add('invalid')
 input.focus()
}
function visibility(visible){
 password.type=visible?'text':'password'
 byId('eye').setAttribute('aria-pressed',String(visible))
 byId('eye').setAttribute('aria-label',visible?'پنهان کردن رمز عبور':'نمایش رمز عبور')
 byId('eye').innerHTML=icon(visible?'off':'eye')
}
function render(next,focus=true){
 stage=next
 document.body.dataset.step=next
 const account=next==='account',done=next==='success'
 form.hidden=done
 byId('count').textContent=account?'گام ۱ از ۲':done?'پایان ورود':'گام ۲ از ۲'
 byId('heading').textContent=account?'ورود به پنل':done?'وارد شدید':'ورود با رمز عبور'
 byId('nameBox').hidden=!account
 username.readOnly=!account
 byId('passBox').hidden=account||done
 password.disabled=done
 byId('actionText').textContent=account?'ادامه':'ورود به پنل'
 byId('actionIcon').innerHTML=icon('arrow')
 byId('announce').textContent=done?'ورود موفق بود.':account?'':'گام ۲ از ۲، رمز عبور'
 clearError()
 visibility(false)
 const context=byId('context')
 if(done){
  context.textContent='در حال باز کردن پنل…'
  password.value=''
  byId('heading').focus()
  return
 }
 if(account){context.innerHTML='<span class="typing"><span>با نام کاربری خود شروع کنید.</span></span>'}
 else{
  context.innerHTML='<span class="identity">'+icon('person')+'<bdi></bdi></span><button class="edit" type="button" id="edit">تغییر حساب</button>'
  context.querySelector('bdi').textContent=username.value
  byId('edit').onclick=()=>{if(!working){password.value='';render('account')}}
 }
 const active=account?username:password
 const box=active.closest('.input-shell')
 box.classList.remove('step-in')
 void box.offsetWidth
 box.classList.add('step-in')
 if(focus)active.focus()
}
function busy(value){
 working=value
 form.classList.toggle('busy',value)
 form.setAttribute('aria-busy',String(value))
 byId('action').setAttribute('aria-disabled',String(value))
 byId('eye').disabled=value
 byId('edit').disabled=value
 password.readOnly=value
 byId('actionText').textContent=value?'در حال بررسی…':'ورود به پنل'
 byId('actionIcon').innerHTML=icon(value?'wait':'arrow')
 byId('announce').textContent=value?'در حال بررسی ورود':''
}
byId('eye').onclick=()=>visibility(password.type==='password')
form.addEventListener('input',clearError)
form.onsubmit=async event=>{
 event.preventDefault()
 if(working||stage==='success')return
 if(stage==='account'){
  if(!username.value){error('نام کاربری را وارد کنید.',username);return}
  render('password')
  return
 }
 if(!password.value){error('رمز عبور را وارد کنید.',password);return}
 clearError()
 busy(true)
 try{
  const response=await fetch('/api/login',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({user:username.value,pass:password.value})
  })
  const result=await response.json().catch(()=>({}))
  if(response.ok&&result.ok===true){
   render('success')
   const delay=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:420
   window.setTimeout(()=>location.replace('/'),delay)
   return
  }
  busy(false)
  const message=result.error||'ورود ناموفق بود.'
  if(response.status===401)error(message,password)
  else byId('feedback').textContent=message
 }catch{
  busy(false)
  byId('feedback').textContent='ارتباط با پنل برقرار نشد. دوباره تلاش کنید.'
 }
}
render('account',window.matchMedia('(pointer:fine)').matches)
installThemeControl()
</script>
</body></html>
